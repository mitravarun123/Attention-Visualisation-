[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attentionlens"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch", "transformers>=4.40,<5", "plotly", "streamlit", "pyyaml", "numpy", "matplotlib", "pytest"]

[project.optional-dependencies]
retnet = ["torchscale"]
web = ["fastapi", "uvicorn"]
training = ["torchscale", "datasets"]

[tool.setuptools.packages.find]
include = ["attentionlens*"]